# Remplace `/etc/nginx/conf.d/default.conf` de l'image nginx (cf. Dockerfile).
# Identique à la config par défaut, plus la seule chose qui lui manquait :
# servir la page 404 du site (`src/pages/404.astro` → `dist/404.html`) au lieu
# de la page blanche d'nginx pour toute URL inconnue.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # `internal` : `/404.html` n'est pas une page à part entière, seulement la
    # réponse aux URL inconnues — demandée directement, elle répond aussi 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
