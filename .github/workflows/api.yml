# CI de l'API d'estimation (dossier `api/`).
#
# Indépendante de `deploy.yml` : le site statique n'a aucune raison d'être
# reconstruit quand seule l'API change, et réciproquement (spec §2.2).
#
# Le déploiement lui-même est assuré par Coolify (webhook sur push `main`
# filtré sur `api/**`) : cette CI ne fait que valider.

name: API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  test:
    name: Lint, typecheck et tests
    runs-on: ubuntu-latest

    services:
      # PostGIS, et non `postgres` nu : l'extension doit être disponible
      # (spec §9, risque principal du Lot 0).
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: estimer
          POSTGRES_PASSWORD: estimer
          POSTGRES_DB: estimer_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U estimer -d estimer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TZ: UTC
      NODE_ENV: test
      PORT: 3334
      HOST: 127.0.0.1
      LOG_LEVEL: silent
      APP_KEY: ci_only_key_1234567890abcdefgh
      DB_HOST: 127.0.0.1
      DB_PORT: 5434
      DB_USER: estimer
      DB_PASSWORD: estimer
      DB_DATABASE: estimer_test
      CORS_ORIGINS: https://estimer.co,http://localhost:4322
      TRUSTED_PROXY: 10.0.0.0/8,127.0.0.1/32
      # Adresses volontairement inatteignables : un appel réseau réel dans un
      # test doit échouer bruyamment, jamais réussir en silence.
      BAN_API_URL: http://127.0.0.1:9/ban-doit-etre-bouchonne
      DVF_BASE_URL: http://127.0.0.1:9/dvf-doit-etre-bouchonne
      IP_HASH_SALT: ci_salt
      LIMITER_STORE: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (Japa)
        run: npm test

  build:
    name: Build de l'image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build AdonisJS
        run: node ace build

      # Vérifie que le Dockerfile de production construit réellement.
      # L'image n'est pas poussée ici : Coolify la reconstruit au déploiement.
      - name: Build de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          tags: estimer-api:ci
